<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- HOD dashboard background: a soft rose-and-lavender sunrise over layered hills -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a72"/>
      <stop offset="0.35" stop-color="#b8648a"/>
      <stop offset="0.62" stop-color="#f3a98c"/>
      <stop offset="0.8" stop-color="#ffd8a8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.62" r="0.38">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#ffe2b0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb98f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb98f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98aa3"/>
      <stop offset="1" stop-color="#c06f8c"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b25a80"/>
      <stop offset="1" stop-color="#94476d"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f3a63"/>
      <stop offset="1" stop-color="#5e2a4d"/>
    </linearGradient>
    <linearGradient id="hill4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2240"/>
      <stop offset="1" stop-color="#2e1529"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <circle cx="992" cy="610" r="70" fill="#fff6e0" opacity="0.95"/>

  <!-- soft clouds -->
  <g fill="#ffffff" filter="url(#soft)">
    <ellipse cx="300" cy="230" rx="220" ry="34" opacity="0.28"/>
    <ellipse cx="520" cy="300" rx="160" ry="24" opacity="0.22"/>
    <ellipse cx="1240" cy="200" rx="260" ry="36" opacity="0.25"/>
    <ellipse cx="1380" cy="330" rx="170" ry="22" opacity="0.2"/>
    <ellipse cx="860" cy="420" rx="210" ry="20" opacity="0.18"/>
  </g>

  <!-- a few early stars still out in the top of the sky -->
  <g fill="#fff">
    <circle cx="140" cy="90" r="2" opacity="0.7"/>
    <circle cx="410" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="690" cy="120" r="1.8" opacity="0.5"/>
    <circle cx="1060" cy="70" r="2" opacity="0.65"/>
    <circle cx="1330" cy="110" r="1.5" opacity="0.55"/>
    <circle cx="1510" cy="50" r="2" opacity="0.6"/>
    <circle cx="880" cy="40" r="1.4" opacity="0.5"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5b2f52" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M610 360 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M668 330 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M720 372 q8 -7 16 0 q8 -7 16 0"/>
  </g>

  <!-- layered hills, far to near -->
  <path d="M0 690 C200 640 360 650 540 680 C720 710 860 640 1040 650 C1220 660 1400 700 1600 670 L1600 1000 L0 1000 Z" fill="url(#hill1)" opacity="0.9"/>
  <path d="M0 760 C180 720 330 740 500 770 C700 805 820 730 1010 740 C1200 750 1380 800 1600 760 L1600 1000 L0 1000 Z" fill="url(#hill2)"/>
  <path d="M0 840 C220 800 380 820 560 850 C760 885 900 820 1100 830 C1300 840 1450 880 1600 850 L1600 1000 L0 1000 Z" fill="url(#hill3)"/>
  <path d="M0 920 C240 885 420 905 640 930 C860 955 1020 900 1240 910 C1400 918 1500 940 1600 930 L1600 1000 L0 1000 Z" fill="url(#hill4)"/>

  <!-- a lone tree on the near hill -->
  <g fill="#2e1529">
    <rect x="1316" y="840" width="8" height="74" rx="3"/>
    <ellipse cx="1320" cy="828" rx="38" ry="30"/>
    <ellipse cx="1296" cy="846" rx="24" ry="18"/>
    <ellipse cx="1346" cy="848" rx="24" ry="17"/>
  </g>
</svg>
